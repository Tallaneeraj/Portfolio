
services:
  kafka-node-1:
    image: apache/kafka:3.8.1
    container_name: kafka-node-1
    ports:
      - 29092:9092
      - 9991:9991
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker, controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node-1:9093,2@kafka-node-2:9093,3@kafka-node-3:9093
      KAFKA_JMX_PORT: 9991
    networks:
      - NRJ
    volumes:
      - controller_data_1:/var/lib/kafka/data

  kafka-node-2:
      image: apache/kafka:3.8.1
      container_name: kafka-node-2
      ports:
        - 39092:9092
        - 9992:9992  # Add JMX port
      environment:
        KAFKA_NODE_ID: 2
        KAFKA_PROCESS_ROLES: 'broker, controller'
        KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node-2:19092,PLAINTEXT_HOST://localhost:39092
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node-1:9093,2@kafka-node-2:9093,3@kafka-node-3:9093
        KAFKA_JMX_PORT: 9992  # Added JMX port
      networks:
        - NRJ
      volumes:
        - controller_data_2:/var/lib/kafka/data

  kafka-node-3:
    image: apache/kafka:3.8.1
    container_name: kafka-node-3
    ports:
      - 49092:9092
      - 9993:9993  # Add JMX port
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker, controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node-3:19092,PLAINTEXT_HOST://localhost:49092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node-1:9093,2@kafka-node-2:9093,3@kafka-node-3:9093
      KAFKA_JMX_PORT: 9993  # Added JMX port
    networks:
      - NRJ
    volumes:
      - controller_data_3:/var/lib/kafka/data


  spark-master:
    image: bitnami/spark:latest
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"
      - "4040:4040"
      - "8081:8081"
    networks:
      - NRJ

  spark-worker:
    image: bitnami/spark:latest
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_MASTER_URL: spark://spark-master:7077
    networks:
      - NRJ  

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.1
    container_name: schema-registry
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka-node-1:19092,kafka-node-2:19092,kafka-node-3:19092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    depends_on:
      - kafka-node-1
      - kafka-node-2
      - kafka-node-3
    networks:
      - NRJ

  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: console
    ports:
      - "8080:8080"
    depends_on:
      - schema-registry
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./config.yml:/tmp/config.yml
    networks:
      - NRJ

  prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      volumes:
        - ./monitoring/prometheus:/etc/prometheus
      depends_on:
        - kafka-node-1
        - kafka-node-2
        - kafka-node-3
      ports:
        - "9091:9090"
      networks:
        - NRJ  

  alertmanager:
      image: prom/alertmanager:v0.27.0
      ports:
        - "59093:9093"
      networks:
        - NRJ        

  kafka-exporter:
      image: bitnami/jmx-exporter:latest
      container_name: kafka-exporter
      ports:
        - "9991:9991"
      environment:
        JMX_EXPORTER_PORT: 9991
        JMX_EXPORTER_CONFIG: /config.yaml
      volumes:
        - ./kafka-jmx-config.yml:/config.yaml
      depends_on:
        - kafka-node-1
        - kafka-node-2
        - kafka-node-3
      networks:
        - NRJ
  

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - NRJ    
    

networks:
  NRJ:

volumes:
  controller_data_1:
  controller_data_2:
  controller_data_3:
  broker_data_1:
  broker_data_2:
  broker_data_3:
