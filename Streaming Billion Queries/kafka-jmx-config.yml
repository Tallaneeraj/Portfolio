lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
    name: "kafka_server_$1_$2"
    type: GAUGE
  - pattern: "kafka.network<type=(.+), name=(.+)><>Value"
    name: "kafka_network_$1_$2"
    type: GAUGE
  - pattern: "kafka.controller<type=(.+), name=(.+)><>Value"
    name: "kafka_controller_$1_$2"
    type: GAUGE
  - pattern: "kafka.log<type=Log, name=(.+), topic=(.+), partition=(.+)><>Value"
    name: "kafka_log_$1"
    labels:
      topic: "$2"
      partition: "$3"
    type: GAUGE
  - pattern: "kafka.(.+)<type=(.+), name=(.+)><>Value"
    name: "kafka_$1_$2_$3"
    type: GAUGE
  - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionTime"
    name: "jvm_gc_collection_time"
    labels:
      gc: "$1"
    type: COUNTER
  - pattern: "java.lang<type=Memory, name=HeapMemoryUsage><>used"
    name: "jvm_memory_heap_used"
    type: GAUGE
  - pattern: "java.lang<type=Memory, name=NonHeapMemoryUsage><>used"
    name: "jvm_memory_non_heap_used"
    type: GAUGE
